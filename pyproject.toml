[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saturation-meter"
version = "0.1.0"
description = "Thematic saturation estimation for qualitative research — stop-point guidance from coded transcript data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ux-research", "qualitative-research", "saturation", "thematic-analysis", "cpr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
gemini = ["google-genai>=1.0"]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
saturation-meter = "saturation_meter.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["saturation_meter*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
